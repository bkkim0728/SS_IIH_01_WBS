# Render Blueprint — 이 저장소를 Render 에 연결하면 자동으로 읽힙니다.
# Render 대시보드 > New > Blueprint > 이 GitHub 저장소 선택
#
# 참고: 정적 사이트(runtime: static)에는 plan 필드를 쓰지 않습니다.
#       요금제 개념이 없어 항상 무료이고, plan 을 넣으면
#       "no such plan free for service type web" 오류가 납니다.
services:
  - type: web
    name: wbs-hub
    runtime: static
    buildCommand: bash build.sh   # 실행 권한(+x)이 없어도 동작하도록 bash 로 호출
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    envVars:
      - key: SUPABASE_URL
        sync: false          # Render 대시보드에서 직접 입력
      - key: SUPABASE_ANON_KEY
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # 폰트는 내용이 바뀌지 않으므로 오래 캐시합니다.
      - path: /assets/fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # CSS/JS/HTML 은 매번 갱신 여부만 확인합니다.
      # (바뀐 스타일이 옛 캐시에 가려지는 것을 막습니다. ETag 로 재검증하므로 가볍습니다.)
      - path: /assets/css/*
        name: Cache-Control
        value: no-cache
      - path: /assets/js/*
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
