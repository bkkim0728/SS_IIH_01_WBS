# Render Blueprint — 이 저장소를 Render 에 연결하면 자동으로 읽힙니다.
# Render 대시보드 > New > Blueprint > 이 GitHub 저장소 선택
services:
  - type: web
    name: wbs-hub
    runtime: static
    plan: free
    buildCommand: ./build.sh
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    envVars:
      - key: SUPABASE_URL
        sync: false          # Render 대시보드에서 직접 입력
      - key: SUPABASE_ANON_KEY
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=3600
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
